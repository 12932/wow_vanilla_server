# The test suites; docs/TESTING.md has the why.
#
# The fast suite, `cargo nextest run --lib`: every test that doesn't need the
# real world. A test that reads the real world (through `harness::real_data`,
# as `load::real_data()` and `harness::load_real` do) is marked
# `#[ignore = "extended"]`; unmarked, it fails in this profile.
#
# The extended suite, `cargo extended` (`cargo nextest run --lib --profile
# extended --run-ignored all`): every test, the real world's too, before a
# merge or a push.

[profile.default]
# A test this slow belongs in the extended suite, or wants simulated time.
slow-timeout = { period = "15s" }

[profile.extended]
# The hand-run probes (`probe_*`, `#[ignore]`d too) print, and check nothing.
default-filter = "not test(/::probe_/)"
slow-timeout = { period = "60s" }

# The long walks first, so that the suite isn't left waiting on one at its end.
[[profile.extended.overrides]]
filter = """test(/::the_real_escort_quests_are_walked::|::the_real_database_event_quests_are_walked::\
|::the_gizelton_caravan_is_done_end_to_end$|::the_imported_event_quests_are_done_end_to_end::\
|::the_nightmare_manifests_is_done_end_to_end$|::event_quests_are_done_as_thistle_tea_does_them::\
|::event_quests_with_their_map_events_are_done::/)"""
priority = 100
