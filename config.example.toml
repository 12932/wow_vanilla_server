# Where on the map, in yards.
# Default 0.0. Needs a restart.
y = 0.0

# Where on the map, in yards.
# Default 0.0. Needs a restart.
z = 0.0

# Facing, in radians.
# Default 0.0. Needs a restart.
orientation = 0.0

