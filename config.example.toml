# wow_vanilla_server's settings: every key, at its default.
#
# Generated by `wow_vanilla_server --print-config --defaults`; a test fails when it drifts.
# Copy what you change into config.toml. Any key may be set from the environment as
# WVS__SECTION__KEY=value (WVS__RATES__XP_KILL=2), over the file. See docs/CONFIG.md.

# Connections: queues, timeouts and limits.
[network]

# Bytes a client's outbound queue may hold; a client that falls
# further behind is disconnected, not sent a partial world.
# Default 4194304. Range 65536 to 1073741824, clamped. Needs a restart.
outbound_channel_bytes = 4194304

# Seconds every read of the login and the world handshake must
# arrive within.
# Default 10. Range 1 to 600, clamped. Needs a restart.
handshake_timeout_secs = 10

# Seconds a client may send nothing before it is disconnected.
# Clients ping every 30.
# Default 120. Range 10 to 3600, clamped. Needs a restart.
client_idle_timeout_secs = 120

# Connections still in the login or the world handshake, at most.
# Default 1024. Range 1 to 1000000, clamped. Needs a restart.
max_pending_connections = 1024

# Packets a client may send a second, sustained (three seconds'
# worth at once); a client that floods is disconnected.
# Default 100. Range 10 to 100000, clamped. Needs a restart.
max_packets_per_sec = 100

# The world: saves, the message of the day, the character store and
# the data's paths.
[world]

# Seconds between saves of each online character.
# Default 300. Range 10 to 86400, clamped. Changes at a reload. mangos: PlayerSave.Interval.
save_interval_secs = 300

# The character store (with the accounts in it).
# Default "characters.sqlite". Needs a restart.
characters_db = "characters.sqlite"

# The directory with `vmangos.sqlite` and `dbc.sqlite`, as Thistle
# Tea exports them; `data/db` if unset and there. Without it the
# world is empty.
# Default unset. Needs a restart. mangos: DataDir.
#data_dir =

# A rustigator bake, the directory with `Azeroth.map`; `data/nav`
# if unset and there. Without it creatures walk straight lines and
# zones come from the client.
# Default unset. Needs a restart.
#nav_dir =

# Thistle Tea's terrain tiles (`nix run .#terrain-data`); `data/terrain`
# if unset and there. Without them liquids have no kind outside
# WMOs: no deep-sea fatigue, no lava in the open.
# Default unset. Needs a restart.
#terrain_dir =

# Shown to every player at login.
# Default "Welcome to wow_vanilla_server.". Changes at a reload. mangos: Motd.
motd = "Welcome to wow_vanilla_server."

# Names no character may take.
# Default []. Needs a restart.
reserved_names = []

# Signatures a guild charter needs.
# Default 9. Range 0 to 9, clamped. Changes at a reload. mangos: MinPetitionSigns.
petition_signatures = 9

# Seconds mail with money or an item takes between accounts.
# Default 3600. Range 0 to 2592000, clamped. Changes at a reload. mangos: MailDeliveryDelay.
mail_delay_secs = 3600

# The weekday honor is ranked on, each week: 1 Monday to 7 Sunday
# (Tuesday, as Thistle Tea).
# Default 2. Range 1 to 7, clamped. Needs a restart.
honor_reset_weekday = 2

# How far players see, in yards. Further costs the server more and
# the client more.
[visibility]

# On the continents.
# Default 100.0. Range 20 to 500, clamped. Changes at a reload. mangos: Visibility.Distance.Continents.
continents_yards = 100.0

# In dungeons and raids (mangos's default is 170; here as far as
# the continents, as before this key).
# Default 100.0. Range 20 to 500, clamped. Changes at a reload. mangos: Visibility.Distance.Instances.
instances_yards = 100.0

# In battlegrounds: further, so a battle's far side is in view.
# Default 400.0. Range 20 to 500, clamped. Changes at a reload. mangos: Visibility.Distance.BGArenas.
battleground_yards = 400.0

# Multipliers on what players earn, and the skill-ups' sizes and
# chances. 1 is 1.12's own.
[rates]

# XP from kills.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.XP.Kill.
xp_kill = 1.0

# XP from quests.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.XP.Quest.
xp_quest = 1.0

# XP from discovering an area.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.XP.Explore.
xp_explore = 1.0

# The drop chance of poor (grey) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Poor.
drop_item_poor = 1.0

# The drop chance of normal (white) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Normal.
drop_item_normal = 1.0

# The drop chance of uncommon (green) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Uncommon.
drop_item_uncommon = 1.0

# The drop chance of rare (blue) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Rare.
drop_item_rare = 1.0

# The drop chance of epic (purple) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Epic.
drop_item_epic = 1.0

# The drop chance of legendary (orange) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Legendary.
drop_item_legendary = 1.0

# The drop chance of artifacts.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Artifact.
drop_item_artifact = 1.0

# The chance a table's reference to another table is rolled.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Referenced.
drop_item_referenced = 1.0

# The drop chance of quest items, for those on the quest.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Quest.
drop_item_quest = 1.0

# Money dropped by creatures and found in chests.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Money.
drop_money = 1.0

# Honor from kills and battlegrounds.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Honor.
honor = 1.0

# Reputation gained from kills, quests and spells (losses are as
# they are).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Reputation.Gain.
reputation_gain = 1.0

# Rested XP earned resting in game.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rest.InGame.
rest_in_game = 1.0

# Rested XP earned logged out in an inn or a city.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rest.Offline.InTavernOrCity.
rest_offline_in_tavern_or_city = 1.0

# Rested XP earned logged out elsewhere (a quarter of an inn's at 1).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rest.Offline.InWilderness.
rest_offline_in_wilderness = 1.0

# Creatures' respawn times (each at least five seconds).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload.
respawn_time = 1.0

# Points a crafting skill rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Crafting.
skill_gain_crafting = 1

# Points a gathering skill (herbalism, mining, skinning,
# lockpicking) rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Gathering.
skill_gain_gathering = 1

# Points a weapon skill rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Weapon.
skill_gain_weapon = 1

# Points defense rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Defense.
skill_gain_defense = 1

# The chance, in percent, an orange recipe raises its skill.
# Default 100. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Orange.
skill_chance_orange = 100

# The chance, in percent, a yellow recipe raises its skill.
# Default 75. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Yellow.
skill_chance_yellow = 75

# The chance, in percent, a green recipe raises its skill.
# Default 25. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Green.
skill_chance_green = 25

# The chance, in percent, a grey recipe raises its skill.
# Default 0. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Grey.
skill_chance_grey = 0

# Creatures: how near they notice players, how far they chase, how
# they call for help, how long their corpses lie.
[creatures]

# Multiplies the distance at which creatures notice players.
# Default 1.0. Range 0 to 10, clamped. Changes at a reload. mangos: Rate.Creature.Aggro.
aggro_rate = 1.0

# Yards from where a fight began that a creature chases before it
# may give up (mangos's default is 30).
# Default 50.0. Range 5 to 500, clamped. Changes at a reload. mangos: LeashRadius.
leash_radius = 50.0

# Seconds beyond its leash without a hostile act before a creature
# goes home.
# Default 12. Range 1 to 600, clamped. Changes at a reload.
leash_timeout_secs = 12

# Seconds a creature tries for a victim it can't reach before it
# goes home.
# Default 24. Range 1 to 600, clamped. Changes at a reload.
unreachable_timeout_secs = 24

# Yards a creature drawn into a fight calls its kind from
# (mangos's default is 5).
# Default 10.0. Range 0 to 100, clamped. Changes at a reload. mangos: CreatureFamilyAssistanceRadius.
assistance_radius = 10.0

# Milliseconds the called take to come.
# Default 1500. Range 0 to 60000, clamped. Changes at a reload. mangos: CreatureFamilyAssistanceDelay.
assistance_delay_ms = 1500

# Yards a fleeing creature looks for help within.
# Default 30.0. Range 0 to 100, clamped. Changes at a reload. mangos: CreatureFamilyFleeAssistanceRadius.
flee_assistance_radius = 30.0

# Seconds a normal creature's corpse lies (no longer than its
# respawn).
# Default 300. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.NORMAL.
corpse_decay_normal = 300

# Seconds a rare's corpse lies (mangos's default is 900).
# Default 300. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.RARE.
corpse_decay_rare = 300

# Seconds an elite's corpse lies.
# Default 600. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.ELITE.
corpse_decay_elite = 600

# Seconds a rare elite's corpse lies (mangos's default is 1200).
# Default 600. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.RAREELITE.
corpse_decay_rare_elite = 600

# Seconds a boss's corpse lies (mangos's default is 3600).
# Default 600. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.WORLDBOSS.
corpse_decay_world_boss = 600

# New characters, the level cap, and the realm's type.
[players]

# The level new characters start at (no higher than `max_level`).
# Default 1. Range 1 to 60, clamped. Changes at a reload. mangos: StartPlayerLevel.
start_level = 1

# The highest level a player can reach.
# Default 60. Range 1 to 60, clamped. Needs a restart. mangos: MaxPlayerLevel.
max_level = 60

# Copper new characters start with.
# Default 0. Range 0 to 2147483647, clamped. Changes at a reload. mangos: StartPlayerMoney.
start_money = 0

# Characters an account may have on the realm.
# Default 10. Range 1 to 10, clamped. Changes at a reload. mangos: CharactersPerRealm.
characters_per_realm = 10

# A PvP realm: an account's characters are all of one side, and
# everyone is flagged for PvP.
# Default false. Needs a restart. mangos: GameType.
pvp_realm = false

# Battlegrounds' queues and matches.
[battleground]

# Seconds from a match's first arrival to its start.
# Default 120. Range 0 to 600, clamped. Changes at a reload.
start_delay_secs = 120

# Players a side needs for a match; 0 for each battleground's own.
# Default 0. Range 0 to 40, clamped. Changes at a reload.
min_players = 0

# Seconds after a match ends before everyone is sent home.
# Default 120. Range 10 to 600, clamped. Changes at a reload.
auto_leave_secs = 120

# Seconds an invitation to a match stands.
# Default 120. Range 10 to 600, clamped. Changes at a reload.
invitation_secs = 120

# The movement check: a player who moves faster than they can is
# pulled back. GMs are never checked.
[anticheat]

# Check players' movement at all.
# Default true. Changes at a reload.
speed_check = true

# How much faster than their speed a player may seem to go.
# Default 1.25. Range 1 to 10, clamped. Changes at a reload.
speed_tolerance = 1.25

# Seconds of lag a movement packet may carry.
# Default 0.5. Range 0 to 5, clamped. Changes at a reload.
latency_allowance_secs = 0.5

# Who may log in, and who is a GM.
[accounts]

# Every account is an administrator. For development and load
# tests only.
# Default false. Needs a restart.
everyone_gm = false

# `auto`: an unknown name gets an account at its first login, with
# the name as its password (development and load tests).
# `existing`: only accounts made with `.account create`.
# Default "auto". Needs a restart.
creation = "auto"

# GM levels by account: 1 moderator, 2 game master, 3
# administrator, as `{ ADMIN = 3 }`.
# Default {}. Needs a restart.
gm = {}

# GM commands and GMs' characters.
[gm]

# The level a GM's new characters start at, if above
# `[players] start_level`.
# Default 1. Range 1 to 60, clamped. Changes at a reload. mangos: GM.StartLevel.
start_level = 1

# The GM level a command needs, by its name, over the server's own
# (0 player to 3 administrator), as `{ kick = 2, announce = 2 }`.
# Default {}. Changes at a reload.
command_levels = {}

# Where new characters start, instead of their race's starting zone:
# peon's heartbeat placement assumes Gurubashi Arena's pit.
[spawn]

# Start new characters here.
# Default false. Needs a restart.
enabled = false

# The map (0 Eastern Kingdoms, 1 Kalimdor).
# Default 0. Needs a restart.
map = 0

# Where on the map, in yards.
# Default 0.0. Needs a restart.
x = 0.0

# Where on the map, in yards.
# Default 0.0. Needs a restart.
y = 0.0

# Where on the map, in yards.
# Default 0.0. Needs a restart.
z = 0.0

# Facing, in radians.
# Default 0.0. Needs a restart.
orientation = 0.0

# Gurubashi Arena's last man standing: `.arena start [countdown s]
# [max minutes]` starts one with everyone alive on the pit's floor.
[arena]

# Minutes between scheduled battles; 0 for only those a GM starts.
# Default 0. Needs a restart.
every_minutes = 0

# Seconds of countdown before a battle.
# Default 30. Needs a restart.
countdown_secs = 30

# Seconds into the fight the ring of fire starts closing.
# Default 120. Needs a restart.
ring_after_secs = 120

# Seconds between the ring's steps.
# Default 20. Range 1 to 3600, clamped. Needs a restart.
ring_every_secs = 20

# Yards the ring closes by at each step.
# Default 5.0. Needs a restart.
ring_step_yards = 5.0

# The ring's smallest radius.
# Default 6.0. Needs a restart.
ring_min_yards = 6.0

# The longest a battle runs: then the ring is at its smallest and
# burns its hardest.
# Default 20. Needs a restart.
max_minutes = 20

# The champion's prize in copper.
# Default 250000. Needs a restart.
reward_copper = 250000

# The champion's item (Arena Grand Master).
# Default 19024. Needs a restart.
reward_item = 19024

# The champion's buff (Spirit of Zandalar).
# Default 24425. Needs a restart.
champion_spell = 24425

# Fighters a battle needs to start.
# Default 2. Needs a restart.
min_fighters = 2
