# wow_vanilla_server's settings: every key, at its default.
#
# Generated by `wow_vanilla_server --print-config --defaults`; a test fails when it drifts.
# Copy what you change into config.toml. Any key may be set from the environment as
# WVS__SECTION__KEY=value (WVS__RATES__XP_KILL=2), over the file. See docs/CONFIG.md.

# Connections: queues, timeouts and limits.
[network]

# Bytes a client's outbound queue may hold; a client that falls
# further behind is disconnected, not sent a partial world.
# Default 4194304. Range 65536 to 1073741824, clamped. Needs a restart.
outbound_channel_bytes = 4194304

# Seconds every read of the login and the world handshake must
# arrive within.
# Default 10. Range 1 to 600, clamped. Needs a restart.
handshake_timeout_secs = 10

# Seconds a client may send nothing before it is disconnected.
# Clients ping every 30.
# Default 120. Range 10 to 3600, clamped. Needs a restart.
client_idle_timeout_secs = 120

# Connections still in the login or the world handshake, at most.
# Default 1024. Range 1 to 1000000, clamped. Needs a restart.
max_pending_connections = 1024

# Packets a client may send a second, sustained (three seconds'
# worth at once); a client that floods is disconnected.
# Default 100. Range 10 to 100000, clamped. Needs a restart.
max_packets_per_sec = 100

# Read-only queries (names, creatures, objects, items, quests,
# texts, times) a client may send a second, sustained (three
# seconds' worth at once), apart from the packets: a client
# walking into a crowd asks after everyone in it at once. One that
# floods them is disconnected.
# Default 1000. Range 10 to 1000000, clamped. Needs a restart.
max_queries_per_sec = 1000

# Packets of a client's that may wait for its map at once. One
# more is not read from the client until the map has taken one:
# a map that falls behind holds its clients back, rather than
# queueing without end (a heartbeat waiting with nothing behind it
# is replaced by the client's next, and takes no more room).
# Default 64. Range 8 to 65536, clamped. Needs a restart.
max_queued_packets = 64

# Pings a client may send in a row each less than 27 seconds after
# the last (the client pings every 30) before it is disconnected;
# 0 never disconnects.
# Default 2. Range 0 to 1000, clamped. Needs a restart. mangos: MaxOverspeedPings.
max_overspeed_pings = 2

# Where the login server listens, `ip:port`. Every interface by
# default (decision 53); `127.0.0.1:3724` keeps it to this
# machine, as a load test should.
# Default "0.0.0.0:3724". Needs a restart.
auth_address = "0.0.0.0:3724"

# Where the world server listens, `ip:port`. Without
# `WOW_REALM_ADDRESS`, the realm list sends clients to
# `localhost` on its port.
# Default "0.0.0.0:8085". Needs a restart.
world_address = "0.0.0.0:8085"

# Milliseconds a map may keep players' movement before it sends
# it on, gathering what each client is sent into one write: a
# crowd's packets cost far less so, a little later. 0 sends each
# burst of movement as it is handled.
# Default 10. Range 0 to 50, clamped. Changes at a reload.
broadcast_batch_ms = 10

# The world: saves, the message of the day, the character store and
# the data's paths.
[world]

# Seconds between saves of each online character.
# Default 300. Range 10 to 86400, clamped. Changes at a reload. mangos: PlayerSave.Interval.
save_interval_secs = 300

# The character store (with the accounts in it).
# Default "characters.sqlite". Needs a restart.
characters_db = "characters.sqlite"

# The directory with `vmangos.sqlite` and `dbc.sqlite`, as Thistle
# Tea exports them; `data/db` if unset and there. The server won't
# start on data that is missing or doesn't load; without any, the
# world is empty, and only for a store with no characters.
# Default unset. Needs a restart. mangos: DataDir.
#data_dir =

# A rustigator bake, the directory with `Azeroth.map`; `data/nav`
# if unset and there. Without it creatures walk straight lines and
# zones come from the client.
# Default unset. Needs a restart.
#nav_dir =

# Thistle Tea's terrain tiles (`nix run .#terrain-data`); `data/terrain`
# if unset and there. Without them liquids have no kind outside
# WMOs: no deep-sea fatigue, no lava in the open.
# Default unset. Needs a restart.
#terrain_dir =

# Seconds a navmesh or terrain tile is kept with no player or
# awake creature near it and nothing asking about it; then it is
# let go, and read again if it is needed. 0 keeps every tile read.
# Default 300. Range 0 to 86400, clamped. Changes at a reload. mangos: GridCleanUpDelay.
tile_unload_secs = 300

# Shown to every player at login.
# Default "Welcome to wow_vanilla_server.". Changes at a reload. mangos: Motd.
motd = "Welcome to wow_vanilla_server."

# Names no character may take.
# Default []. Needs a restart.
reserved_names = []

# Signatures a guild charter needs.
# Default 9. Range 0 to 9, clamped. Changes at a reload. mangos: MinPetitionSigns.
petition_signatures = 9

# Seconds mail with money or an item takes between accounts.
# Default 3600. Range 0 to 2592000, clamped. Changes at a reload. mangos: MailDeliveryDelay.
mail_delay_secs = 3600

# The weekday honor is ranked on, each week: 1 Monday to 7 Sunday
# (Tuesday, as Thistle Tea).
# Default 2. Range 1 to 7, clamped. Needs a restart.
honor_reset_weekday = 2

# Honorable kills a week needs to be ranked at its end.
# Default 15. Range 1 to 10000, clamped. Changes at a reload. mangos: MinHonorKills.
min_honor_kills = 15

# The most players a `/who` lists (the client shows 50 at most).
# Default 49. Range 1 to 49, clamped. Changes at a reload. mangos: MaxWhoListReturns.
max_who_list_returns = 49

# Zones' weather changes: rain, snow and storms, by the season.
# Off, the weather is fine everywhere but where a GM set it for
# good.
# Default true. Changes at a reload. mangos: ActivateWeather.
weather = true

# Seconds between a zone's rolls for a change of weather.
# Default 600. Range 10 to 86400, clamped. Changes at a reload. mangos: ChangeWeatherInterval.
weather_change_secs = 600

# The least deposit an auction takes, in copper.
# Default 0. Range 0 to 2147483647, clamped. Changes at a reload. mangos: Auction.Deposit.Min.
auction_deposit_min = 0

# The realm's name in the realm list.
# Default "Location Realm". Needs a restart.
realm_name = "Location Realm"

# How far players see, in yards (further costs the server more and
# the client more), and what working it out may take.
[visibility]

# On the continents.
# Default 100.0. Range 20 to 500, clamped. Changes at a reload. mangos: Visibility.Distance.Continents.
continents_yards = 100.0

# In dungeons and raids.
# Default 170.0. Range 20 to 500, clamped. Changes at a reload. mangos: Visibility.Distance.Instances.
instances_yards = 170.0

# In battlegrounds: further, so a battle's far side is in view.
# Default 400.0. Range 20 to 500, clamped. Changes at a reload. mangos: Visibility.Distance.BGArenas.
battleground_yards = 400.0

# On a flight master's gryphon or wyvern: further, as the land
# goes by below. Back to the map's own on landing.
# Default 400.0. Range 20 to 500, clamped. Changes at a reload.
flight_yards = 400.0

# How long a map's update may spend on visibility's refreshes, in
# milliseconds: past it the rest wait for the next update (20 a
# second), oldest first, so a crowd moving in step can't stall a
# map. At least one chunk (128) is done each update.
# Default 10. Range 0 to 1000, clamped. Changes at a reload.
refresh_budget_ms = 10

# Threads that work out visibility's refreshes for the maps, read
# only, before each map applies them; 1 works them out on the
# map's own thread, 0 takes the machine's cores, up to 8.
# Default 0. Range 0 to 64, clamped. Needs a restart.
refresh_threads = 0

# Past these yards from a player who moves, those who see them
# get only every `distant_move_every`th of their heartbeats (a
# start, a stop, a jump, a turn or a landing always): fewer
# packets for a crowd's far side. 0 sends every heartbeat to
# everyone, as 1.12's servers do.
# Default 0.0. Range 0 to 500, clamped. Changes at a reload.
distant_move_yards = 0.0

# Of a mover's heartbeats, the share an observer past
# `distant_move_yards` gets: one in this many. 1 is every one.
# Default 1. Range 1 to 100, clamped. Changes at a reload.
distant_move_every = 1

# Chat: how far it carries, and the flood control. GMs aren't
# muted.
[chat]

# Yards a say carries, players' and creatures'.
# Default 25.0. Range 1 to 500, clamped. Changes at a reload. mangos: ListenRange.Say.
say_yards = 25.0

# Yards a yell carries, and a boss's emote.
# Default 300.0. Range 1 to 1000, clamped. Changes at a reload. mangos: ListenRange.Yell.
yell_yards = 300.0

# Yards an emote (`/wave`) carries.
# Default 25.0. Range 1 to 500, clamped. Changes at a reload. mangos: ListenRange.TextEmote.
text_emote_yards = 25.0

# Lines in a row, each within `flood_message_delay_secs` of the
# last, that mute a player; 0 never mutes.
# Default 10. Range 0 to 1000, clamped. Changes at a reload. mangos: ChatFlood.MessageCount.
flood_message_count = 10

# Seconds within which a line follows the last to count towards
# a flood.
# Default 1. Range 1 to 60, clamped. Changes at a reload. mangos: ChatFlood.MessageDelay.
flood_message_delay_secs = 1

# Seconds a flooding player is muted.
# Default 10. Range 1 to 86400, clamped. Changes at a reload. mangos: ChatFlood.MuteTime.
flood_mute_secs = 10

# Multipliers on what players earn, regenerate and pay, and the
# skill-ups' sizes and chances. 1 is 1.12's own.
[rates]

# XP from kills.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.XP.Kill.
xp_kill = 1.0

# XP from quests.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.XP.Quest.
xp_quest = 1.0

# XP from discovering an area.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.XP.Explore.
xp_explore = 1.0

# The drop chance of poor (grey) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Poor.
drop_item_poor = 1.0

# The drop chance of normal (white) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Normal.
drop_item_normal = 1.0

# The drop chance of uncommon (green) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Uncommon.
drop_item_uncommon = 1.0

# The drop chance of rare (blue) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Rare.
drop_item_rare = 1.0

# The drop chance of epic (purple) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Epic.
drop_item_epic = 1.0

# The drop chance of legendary (orange) items.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Legendary.
drop_item_legendary = 1.0

# The drop chance of artifacts.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Artifact.
drop_item_artifact = 1.0

# The chance a table's reference to another table is rolled.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Referenced.
drop_item_referenced = 1.0

# The drop chance of quest items, for those on the quest.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Item.Quest.
drop_item_quest = 1.0

# Money dropped by creatures and found in chests.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Drop.Money.
drop_money = 1.0

# Honor from kills and battlegrounds (a dishonorable kill costs
# what it costs).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Honor.
honor = 1.0

# Reputation gained from kills, quests and spells (losses are as
# they are).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Reputation.Gain.
reputation_gain = 1.0

# Rested XP earned resting in game.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rest.InGame.
rest_in_game = 1.0

# Rested XP earned logged out in an inn or a city.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rest.Offline.InTavernOrCity.
rest_offline_in_tavern_or_city = 1.0

# Rested XP earned logged out elsewhere (a quarter of an inn's at 1).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rest.Offline.InWilderness.
rest_offline_in_wilderness = 1.0

# Creatures' respawn times (each at least five seconds).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload.
respawn_time = 1.0

# Points a crafting skill rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Crafting.
skill_gain_crafting = 1

# Points a gathering skill (herbalism, mining, skinning,
# lockpicking) rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Gathering.
skill_gain_gathering = 1

# Points a weapon skill rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Weapon.
skill_gain_weapon = 1

# Points defense rises by at a skill-up.
# Default 1. Range 1 to 100, clamped. Changes at a reload. mangos: SkillGain.Defense.
skill_gain_defense = 1

# The chance, in percent, an orange recipe raises its skill.
# Default 100. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Orange.
skill_chance_orange = 100

# The chance, in percent, a yellow recipe raises its skill.
# Default 75. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Yellow.
skill_chance_yellow = 75

# The chance, in percent, a green recipe raises its skill.
# Default 25. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Green.
skill_chance_green = 25

# The chance, in percent, a grey recipe raises its skill.
# Default 0. Range 0 to 100, clamped. Changes at a reload. mangos: SkillChance.Grey.
skill_chance_grey = 0

# Mining's chance to rise halves each this many points (0: it
# never does, mangos's default).
# Default 0. Range 0 to 300, clamped. Changes at a reload. mangos: SkillChance.MiningSteps.
skill_chance_mining_steps = 0

# Skinning's chance to rise halves each this many points (0: it
# never does, mangos's default).
# Default 0. Range 0 to 300, clamped. Changes at a reload. mangos: SkillChance.SkinningSteps.
skill_chance_skinning_steps = 0

# The least rate a grey creature's kill gives reputation at.
# Default 0.2. Range 0 to 1, clamped. Changes at a reload. mangos: Rate.Reputation.LowLevel.Kill.
reputation_low_level_kill = 0.2

# The least rate a quest well below the player gives reputation
# at: a fifth less for each level past five below, down to this.
# Default 0.2. Range 0 to 1, clamped. Changes at a reload. mangos: Rate.Reputation.LowLevel.Quest.
reputation_low_level_quest = 0.2

# Health players regenerate from spirit.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Health.
health = 1.0

# Mana players regenerate from spirit.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Mana.
mana = 1.0

# Rage from blows dealt and taken.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rage.Income.
rage_income = 1.0

# Rage lost out of combat.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Rage.Loss.
rage_loss = 1.0

# Energy regenerated.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Energy.
energy = 1.0

# Damage from falls.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Damage.Fall.
damage_fall = 1.0

# How long auctions run (the deposit is the chosen time's).
# Default 1.0. Range 0.01 to 100, clamped. Changes at a reload. mangos: Rate.Auction.Time.
auction_time = 1.0

# Auctions' deposits.
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Auction.Deposit.
auction_deposit = 1.0

# The auction house's cut of a sale (never more than the sale).
# Default 1.0. Range 0 to 100, clamped. Changes at a reload. mangos: Rate.Auction.Cut.
auction_cut = 1.0

# Creatures: how near they notice players, how far they chase, how
# they call for help, how long their corpses lie.
[creatures]

# Multiplies the distance at which creatures notice players.
# Default 1.0. Range 0 to 10, clamped. Changes at a reload. mangos: Rate.Creature.Aggro.
aggro_rate = 1.0

# Yards from where a fight began that a creature chases before it
# may give up (mangos's default is 30).
# Default 31.0. Range 5 to 500, clamped. Changes at a reload. mangos: LeashRadius.
leash_radius = 31.0

# Seconds beyond its leash without a hostile act before a creature
# goes home, by its level: `level:seconds`, each from that level
# up (1.12's brackets: 11 s to 29, 12 to 39, 13 to 44, 14 to 49,
# 15 from 50).
# Default ["1:11", "30:12", "40:13", "45:14", "50:15"]. Changes at a reload.
leash_timeout_by_level = ["1:11", "30:12", "40:13", "45:14", "50:15"]

# How often a fighting creature looks at its leash, in
# milliseconds, from when its fight began: it goes home at the first
# look past its time, so up to this much past it, never before (0
# looks every update).
# Default 1000. Range 0 to 60000, clamped. Changes at a reload.
leash_check_ms = 1000

# Milliseconds a creature stands still in reach of its victim,
# attacking, before that renews its leash as a hostile act on it
# would (and again each as long, while it stands and attacks).
# Default 1250. Range 50 to 600000, clamped. Changes at a reload.
leash_standing_ms = 1250

# Seconds a creature tries for a victim it can't reach before it
# goes home.
# Default 24. Range 1 to 600, clamped. Changes at a reload.
unreachable_timeout_secs = 24

# Yards a creature drawn into a fight calls its kind from.
# Default 5.0. Range 0 to 100, clamped. Changes at a reload. mangos: CreatureFamilyAssistanceRadius.
assistance_radius = 5.0

# Milliseconds the called take to come.
# Default 1500. Range 0 to 60000, clamped. Changes at a reload. mangos: CreatureFamilyAssistanceDelay.
assistance_delay_ms = 1500

# Yards a fleeing creature looks for help within.
# Default 30.0. Range 0 to 100, clamped. Changes at a reload. mangos: CreatureFamilyFleeAssistanceRadius.
flee_assistance_radius = 30.0

# Milliseconds a creature flees for help, where its script doesn't
# say (mangos's default is 10000).
# Default 7000. Range 0 to 60000, clamped. Changes at a reload. mangos: CreatureFamilyFleeDelay.
flee_delay_ms = 7000

# Seconds a wandering creature stands still once a player talks
# to it.
# Default 180. Range 0 to 3600, clamped. Changes at a reload. mangos: InteractionPauseTimer.
interaction_pause_secs = 180

# Seconds a normal creature's corpse lies (no longer than its
# respawn).
# Default 300. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.NORMAL.
corpse_decay_normal = 300

# Seconds a rare's corpse lies.
# Default 900. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.RARE.
corpse_decay_rare = 900

# Seconds an elite's corpse lies.
# Default 600. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.ELITE.
corpse_decay_elite = 600

# Seconds a rare elite's corpse lies.
# Default 1200. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.RAREELITE.
corpse_decay_rare_elite = 1200

# Seconds a boss's corpse lies.
# Default 3600. Range 1 to 86400, clamped. Changes at a reload. mangos: Corpse.Decay.WORLDBOSS.
corpse_decay_world_boss = 3600

# Town guards, as mangos-classic calls them: a guard each time a
# creature that calls the guards takes a victim. A town's alarm
# counts the guards called there lately and cools when the calls
# stop; as it rises, the guards grow harder to fight, a capital sends
# its elite two at a time, then its Elite Guards, and at the top its
# champion comes with more of them: Jaina Proudmoore to Stormwind,
# Ironforge and Darnassus, Rexxar to Orgrimmar, the Undercity and
# Thunder Bluff.
[guards]

# Seconds a called guard stays once out of combat (mangos-classic's
# 30); it goes at once when it dies.
# Default 300. Range 5 to 86400, clamped. Changes at a reload.
despawn_secs = 300

# Yards a called guard wanders about where it came, out of combat,
# and again once home from a fight.
# Default 10.0. Range 0 to 30, clamped. Changes at a reload.
wander_yards = 10.0

# Seconds without a call after which a town's alarm halves.
# Default 300. Range 10 to 86400, clamped. Changes at a reload.
alarm_half_life_secs = 300

# Guards in the alarm from which each new guard comes with
# Avoidance (spell 23198's aura: area spells miss it that many
# percent more often).
# Default 20. Range 1 to 100000, clamped. Changes at a reload.
avoidance_from = 20

# Avoidance, in percent, at the threshold and for each further
# `avoidance_step_guards` guards.
# Default 5. Range 0 to 100, clamped. Changes at a reload.
avoidance_step_pct = 5

# Guards in the alarm per step of Avoidance.
# Default 10. Range 1 to 100000, clamped. Changes at a reload.
avoidance_step_guards = 10

# The most Avoidance a guard comes with, in percent.
# Default 50. Range 0 to 100, clamped. Changes at a reload.
avoidance_max_pct = 50

# Guards in the alarm from which a call brings two of the town's
# elite (Stormwind's Royal Guard, Orgrimmar's Kor'kron, Undercity's
# Royal Dreadguard, Thunder Bluff's Honor Guard), or two of its
# guards where it has none.
# Default 40. Range 1 to 100000, clamped. Changes at a reload.
royal_from = 40

# Guards in the alarm of a defended city (one in `jaina_cities` or
# `rexxar_cities`) whose crossing brings `elite_count` of the
# city's Elite Guards (Stormwind's, Ironforge's, Darnassus's
# Sentinels, Orgrimmar's Grunts, the Undercity's Deathguards,
# Thunder Bluff's Bluffwatchers) near the call that crossed it,
# against its attacker: once each time the alarm rises through
# it, not at each call.
# Default 50. Range 1 to 100000, clamped. Changes at a reload.
elite_from = 50

# Elite Guards the crossing of `elite_from` brings.
# Default 2. Range 0 to 20, clamped. Changes at a reload.
elite_count = 2

# The cities Jaina defends, by area: 1519 Stormwind City, 1537
# Ironforge, 1657 Darnassus. Their alarms bring their Elite Guards
# and her; empty, she never leaves Theramore. She is one: called
# by one while she is out, a city waits, and its next call after
# she is home brings her.
# Default [1519, 1537, 1657]. Changes at a reload.
jaina_cities = [1519, 1537, 1657]

# Guards in the alarm of one of Jaina's cities from which she
# comes, if she is alive and at home in Theramore.
# Default 60. Range 1 to 100000, clamped. Changes at a reload.
jaina_from = 60

# Seconds Jaina stays once she has no one left to fight and is
# out of combat, before she goes home.
# Default 60. Range 5 to 86400, clamped. Changes at a reload.
jaina_stays_secs = 60

# The city's Elite Guards who come with Jaina, around her, walk to
# her side fighting what they meet, guard her, and leave with her.
# Default 4. Range 0 to 20, clamped. Changes at a reload.
jaina_elites = 4

# Yards from Jaina her Elite Guards come.
# Default 40.0. Range 5 to 100, clamped. Changes at a reload.
jaina_elites_yards = 40.0

# Seconds Jaina takes to come back to Theramore once she has died
# in a city (her spawn's own time, a day).
# Default 86400. Range 5 to 2592000, clamped. Changes at a reload.
jaina_respawn_secs = 86400

# The cities Rexxar defends, by area: 1637 Orgrimmar, 1497 the
# Undercity, 1638 Thunder Bluff. Their alarms bring their Elite
# Guards and him, with Misha; empty, he never leaves Desolace. One
# Rexxar, as one Jaina.
# Default [1637, 1497, 1638]. Changes at a reload.
rexxar_cities = [1637, 1497, 1638]

# Guards in the alarm of one of Rexxar's cities from which he
# comes, if he is alive and at home in Desolace.
# Default 60. Range 1 to 100000, clamped. Changes at a reload.
rexxar_from = 60

# Seconds Rexxar stays once he has no one left to fight and is out
# of combat, before he goes.
# Default 60. Range 5 to 86400, clamped. Changes at a reload.
rexxar_stays_secs = 60

# The city's Elite Guards who run in with Rexxar, behind him,
# guard him, and run off with him.
# Default 4. Range 0 to 20, clamped. Changes at a reload.
rexxar_elites = 4

# Yards from the fight Rexxar comes into the city, out of sight
# (past the 100 yards a player sees and its 10 more), to run in;
# nearer where no walk from there reaches the fight.
# Default 110.0. Range 10 to 300, clamped. Changes at a reload.
rexxar_arrive_yards = 110.0

# Yards Rexxar runs off before he is gone, as he leaves a city
# and as he leaves Desolace for one.
# Default 40.0. Range 5 to 100, clamped. Changes at a reload.
rexxar_run_yards = 40.0

# Rexxar's run speed as he comes and goes, as a multiple of his
# own (his template's, 8 yards a second).
# Default 2.0. Range 1 to 5, clamped. Changes at a reload.
rexxar_run_speed = 2.0

# Seconds Rexxar takes to come back to Desolace once he has died
# in a city (a day, as Jaina's).
# Default 86400. Range 5 to 2592000, clamped. Changes at a reload.
rexxar_respawn_secs = 86400

# New characters, the level cap, the realm's type, and what is left
# of the dead.
[players]

# The level new characters start at (no higher than `max_level`).
# Default 1. Range 1 to 60, clamped. Changes at a reload. mangos: StartPlayerLevel.
start_level = 1

# The highest level a player can reach.
# Default 60. Range 1 to 60, clamped. Needs a restart. mangos: MaxPlayerLevel.
max_level = 60

# Copper new characters start with.
# Default 0. Range 0 to 2147483647, clamped. Changes at a reload. mangos: StartPlayerMoney.
start_money = 0

# Characters an account may have on the realm.
# Default 10. Range 1 to 10, clamped. Changes at a reload. mangos: CharactersPerRealm.
characters_per_realm = 10

# A PvP realm: an account's characters are all of one side, and
# everyone is flagged for PvP.
# Default false. Needs a restart. mangos: GameType.
pvp_realm = false

# Weapon skills and Defense at their caps, at login and each
# level, rather than raised by use from 1.
# Default false. Changes at a reload. mangos: AlwaysMaxSkillForLevel.
always_max_skill_for_level = false

# Hours the bones a corpse turns to lie where it was, once its
# player rises (reclaims it, is raised, or a spirit healer raises
# them), seen by everyone; 0 leaves none. Bones in the open world
# are kept across a restart, with the time they had left; a
# dungeon's or a battleground's go with its copy. mangos-classic
# has no time for them: its bones lie until their grid unloads,
# aren't saved, and `Death.Bones.World` and
# `Death.Bones.Battleground` turn them off.
# Default 18. Range 0 to 8760, clamped. Changes at a reload.
bones_hours = 18

# Yards from a kill a group's member must be for a share of it:
# its XP, loot, quest credit, reputation and honor (in a
# battleground, its honorable kill).
# Default 74.0. Range 5 to 500, clamped. Changes at a reload. mangos: MaxGroupXPDistance.
group_reward_yards = 74.0

# The level from which a spirit healer's resurrection brings
# sickness: a minute at this level, a minute more a level, ten
# at most. Above the level cap, never.
# Default 11. Range 1 to 100, clamped. Changes at a reload. mangos: Death.SicknessLevel.
death_sickness_level = 11

# Primary professions (alchemy, mining, tailoring, ...) a player
# may learn.
# Default 2. Range 0 to 10, clamped. Changes at a reload. mangos: MaxPrimaryTradeSkill.
max_primary_trade_skill = 2

# The chance, in percent, a blow dealt or taken wears a point off
# a random piece of a player's gear.
# Default 0.5. Range 0 to 100, clamped. Changes at a reload. mangos: DurabilityLossChance.Damage.
durability_loss_chance_damage = 0.5

# Seconds a group's leader may be offline before the lead goes
# to a member online (a raid's assistant first); with no one
# online, it waits.
# Default 300. Range 0 to 86400, clamped. Changes at a reload. mangos: Group.OfflineLeaderDelay.
group_offline_leader_secs = 300

# Water and lava: how long a player has before they come to harm,
# and lava's burn.
[environment]

# Seconds of breath under water before drowning.
# Default 60. Range 1 to 3600, clamped. Changes at a reload. mangos: MirrorTimer.Breath.Max.
breath_secs = 60

# Seconds in the deep sea before fatigue.
# Default 60. Range 1 to 3600, clamped. Changes at a reload. mangos: MirrorTimer.Fatigue.Max.
fatigue_secs = 60

# Seconds touching lava before it burns.
# Default 1. Range 0 to 60, clamped. Changes at a reload. mangos: MirrorTimer.Environmental.Max.
lava_secs = 1

# The least fire damage lava does every two seconds.
# Default 605. Range 0 to 1000000, clamped. Changes at a reload. mangos: EnvironmentalDamage.Min.
lava_damage_min = 605

# The most (no less than `lava_damage_min`).
# Default 610. Range 0 to 1000000, clamped. Changes at a reload. mangos: EnvironmentalDamage.Max.
lava_damage_max = 610

# Quests: which givers show what.
[quests]

# Levels a player may be short of a quest's least level and still
# see its giver's grey "!"; further below, the giver shows nothing
# for it. -1 shows it at any gap.
# Default 7. Range -1 to 60, clamped. Changes at a reload. mangos: Quests.HighLevelHideDiff.
high_level_hide_diff = 7

# Dungeon and raid copies.
[instances]

# Seconds an empty copy stays up. What it remembers (its dead,
# who went in) is kept at least thirty minutes after its last use,
# for its players to come back to.
# Default 1800. Range 1 to 86400, clamped. Changes at a reload. mangos: Instance.UnloadDelay.
unload_delay_secs = 1800

# The hour of the day, UTC, raids reset at, on their reset days.
# Default 4. Range 0 to 23, clamped. Changes at a reload. mangos: Instance.ResetTimeHour.
reset_hour = 4

# Copies an account may go into an hour; one it was in within the
# hour doesn't count again.
# Default 5. Range 1 to 1000, clamped. Changes at a reload.
entries_per_hour = 5

# Battlegrounds' queues and matches.
[battleground]

# Seconds from a match's first arrival to its start.
# Default 120. Range 0 to 600, clamped. Changes at a reload.
start_delay_secs = 120

# Players a side needs for a match; 0 for each battleground's own.
# Default 0. Range 0 to 40, clamped. Changes at a reload.
min_players = 0

# Seconds after a match ends before everyone is sent home.
# Default 120. Range 10 to 600, clamped. Changes at a reload.
auto_leave_secs = 120

# Seconds an invitation to a match stands.
# Default 120. Range 10 to 600, clamped. Changes at a reload.
invitation_secs = 120

# A player who leaves a match before its end is a Deserter, kept
# out of battlegrounds for a while.
# Default true. Changes at a reload. mangos: Battleground.CastDeserter.
cast_deserter = true

# Seconds a match goes on with a side short of players before it
# ends, the side ahead (or the larger) winning; 0 never ends it.
# Default 300. Range 0 to 3600, clamped. Changes at a reload. mangos: BattleGround.PrematureFinishTimer.
premature_finish_secs = 300

# World PvP on the continents.
[outdoor_pvp]

# The Eastern Plaguelands' four towers, their buffs (there and in
# Stratholme and Scholomance) and the Crown Guard graveyard.
# Default true. Needs a restart. mangos: OutdoorPvp.EPEnabled.
eastern_plaguelands = true

# Silithus's silithyst and the Cenarion Favor (there and in
# Ahn'Qiraj).
# Default true. Needs a restart. mangos: OutdoorPvp.SIEnabled.
silithus = true

# World events the server runs of itself.
[events]

# The Elemental Invasion: rifts in Un'Goro, Silithus, Azshara and
# Winterspring, their stages and lords, then days of rest. Off,
# it stops where it is.
# Default true. Changes at a reload.
elemental_invasion = true

# The Scourge Invasion's necropolises over the zones it attacks,
# as `.invasion on` (Thistle Tea's `scourge_invasion`, off). A
# GM's `.invasion on` or `off` holds until this changes.
# Default false. Changes at a reload.
scourge_invasion = false

# The movement check: a player who moves faster than they can, over
# time, is pulled back. GMs are never checked.
[anticheat]

# Check players' movement at all.
# Default true. Changes at a reload.
speed_check = true

# How much faster than their speed a player may seem to go.
# Default 1.25. Range 1 to 10, clamped. Changes at a reload.
speed_tolerance = 1.25

# Seconds of their speed a player may get ahead by: the lag their
# packets may bunch up by. Time earns it back; however many
# packets they send, they go no further.
# Default 2.0. Range 0 to 5, clamped. Changes at a reload.
latency_allowance_secs = 2.0

# Yards a player may get ahead by besides, once, not per packet;
# and how far a client under a root may say it is before it is put
# back.
# Default 3.0. Range 0 to 100, clamped. Changes at a reload.
distance_allowance_yards = 3.0

# Who may log in, and who is a GM.
[accounts]

# Every account is an administrator. For development and load
# tests only.
# Default false. Needs a restart.
everyone_gm = false

# `auto`: an unknown name gets an account at its first login, with
# the name as its password (development and load tests).
# `existing`: only accounts made with `.account create`.
# Default "auto". Needs a restart.
creation = "auto"

# GM levels by account: 1 moderator, 2 game master, 3
# administrator, as `{ ADMIN = 3 }`.
# Default {}. Needs a restart.
gm = {}

# GM commands and GMs' characters.
[gm]

# The level a GM's new characters start at, if above
# `[players] start_level`.
# Default 1. Range 1 to 60, clamped. Changes at a reload. mangos: GM.StartLevel.
start_level = 1

# The GM level a command needs, by its name, over the server's own
