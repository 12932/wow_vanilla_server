[network]
# Packets a client may send a second, sustained; a client that floods is disconnected.
#max_packets_per_sec = 100
outbound_channel_bytes = 4194304
#handshake_timeout_secs = 10
#client_idle_timeout_secs = 120
#max_pending_connections = 1024

[world]
visibility_yards = 100.0
save_interval_secs = 300
characters_db = "characters.sqlite"
# The directory with vmangos.sqlite and dbc.sqlite, as Thistle Tea exports them; data/db if unset.
#data_dir = "data/db"
# A rustigator bake: the navmesh; data/nav if unset.
#nav_dir = "data/nav"
# Thistle Tea's terrain tiles (`nix run .#terrain-data`): the kind of liquid outside WMOs, for
# deep-sea fatigue and lava, and areas where the navmesh has none; data/terrain if unset.
#terrain_dir = "data/terrain"
motd = "Welcome to wow_vanilla_server."
# Signatures a guild charter needs.
petition_signatures = 9
# How long mail with money or an item takes between accounts, in seconds.
mail_delay_secs = 3600
# Names no character may take.
#reserved_names = ["Thrall", "Jaina"]
# A PvP realm: an account's characters are all of one side.
pvp_realm = false
# The weekday honor is ranked on, each week: 1 Monday to 7 Sunday (Tuesday, as Thistle Tea).
honor_reset_weekday = 2

[accounts]
# `auto`: an unknown name gets an account at its first login, with the name as its password (for
# development and load tests). `existing`: only accounts made with `.account create`.
creation = "auto"
# Every account is an administrator. For development and load tests only.
everyone_gm = false
# GM levels by account: 1 moderator, 2 game master, 3 administrator.
#gm = { ADMIN = 3 }

# New characters start in Gurubashi Arena's pit rather than their race's starting zone: peon's
# heartbeat placement assumes it.
[spawn]
enabled = true
map = 0
x = -13206.0
y = 272.0
z = 21.857
orientation = 0.0

# Gurubashi Arena's last man standing: `.arena start [countdown s] [max minutes]`
# starts one with everyone alive on the pit's floor.
[arena]
# Minutes between scheduled battles; 0 for only those a GM starts.
every_minutes = 0
countdown_secs = 30
# The ring of fire starts closing this long into the fight, a step at a time.
ring_after_secs = 120
ring_every_secs = 20
ring_step_yards = 5.0
ring_min_yards = 6.0
max_minutes = 20
# The champion's prize: copper, an item (Arena Grand Master) and a buff
# (Spirit of Zandalar).
reward_copper = 250000
reward_item = 19024
champion_spell = 24425
min_fighters = 2
