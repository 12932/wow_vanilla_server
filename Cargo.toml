[package]
name = "wow_vanilla_server"
version = "0.1.1"
edition = "2024"
default-run = "wow_vanilla_server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# When set, every outgoing/incoming opcode is serialized to a test-case string
# and appended to `tests.wowm` (or the matching wowm source). Useful for
# expanding the wow_messages crate's test corpus from a live session, but
# walks `../wow_messages` per packet — never enable in a production build.
wowm-capture = []
# A sampling profiler (pprof, driven by SIGPROF, so it needs no perf-event
# permissions): with `WVS_PPROF=<prefix>` the server profiles a window and
# writes a flame graph and its top functions (`src/profile.rs`).
pprof = ["dep:pprof"]

[dependencies]
tokio = { version = "1.52.3", features = [
    "net",
    "sync",
    "time",
    "io-util",
    "io-std",
    "macros",
    "rt-multi-thread",
    "signal",
] }
wow_login_messages = { git = "https://github.com/12932/wow_messages", rev = "e904e8e190891b0e12e5a23534a9e1743d4720c7", features = ["tokio"] }
wow_world_messages = { git = "https://github.com/12932/wow_messages", rev = "e904e8e190891b0e12e5a23534a9e1743d4720c7", features = ["sync", "tokio", "vanilla", "print-testcase"] }
wow_world_base = { git = "https://github.com/12932/wow_messages", rev = "e904e8e190891b0e12e5a23534a9e1743d4720c7", features = ["extended", "vanilla", "serde"] }
wow_items = { git = "https://github.com/12932/wow_messages", rev = "e904e8e190891b0e12e5a23534a9e1743d4720c7", features = ["vanilla"] }
wow_srp = { git="https://github.com/gtker/wow_srp.git", rev = "9c5382a2915850efc69f05d7985ab06b3ec13163" }
walkdir = "2.5.0"

rustigator = { git = "https://github.com/12932/rustigator", rev = "a1c3a82d4ad170852d9658a36fb80e74e92c3a72", features = ["vanilla"] }
# The navmesh and terrain builds, for the data setup.
rustigator-mapbuild = { git = "https://github.com/12932/rustigator", rev = "a1c3a82d4ad170852d9658a36fb80e74e92c3a72" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
ahash = "0.8.12"
tracing-tracy = { version = "0.11.4", default-features = false, features = [
    "enable",
    "system-tracing",
    "sampling",
    "callstack-inlines",
    "manual-lifetime",
] }
rayon = "1.12.0"
slab = "0.4.12"
tracy-client = { version = "0.18.4", default-features = false, features = [
    "enable",
    "system-tracing",
    "sampling",
    "callstack-inlines",
    "manual-lifetime",
] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rand = "0.10.1"
dotenvy = "0.15.7"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
kanal = "0.1.1"
arc-swap = "1.7.1"
mimalloc = { version = "0.1", default-features = false }
smallvec = "1.13"
parking_lot = "0.12"
flate2 = "1"
md-5 = "0.10"
serde_json = "1"
# The data setup: its questions, its progress bars, and its flags.
dialoguer = { version = "0.12", default-features = false }
indicatif = "0.18"
clap = { version = "4.6", features = ["derive"] }
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

# Free disk space, and on Windows the registry and the fixed drives.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[[bin]]
name = "wow_vanilla_server"
path = "src/main.rs"

# Builds data/nav and data/terrain from the player's WoW client.
[[bin]]
name = "wvs-setup"
path = "src/bin/wvs-setup.rs"

[profile.release]
debug = 0
# Thin LTO and one codegen unit let the compiler inline across modules.
# A panic unwinds: a map whose actor panics is lost, the rest of the
# server goes on.
lto = "thin"
codegen-units = 1
