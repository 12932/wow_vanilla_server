[package]
name = "wow_vanilla_server"
version = "0.1.4"
edition = "2024"
default-run = "wow_vanilla_server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Tracy is in the release binary, dormant until `WOW_TRACY=1` (docs/PROFILING.md).
default = ["tracy"]
# The whole world awake (`wvs-world-bench`, docs/PERFORMANCE.md): the
# benchmark's binary, and the maps' probe it reads (`map/bench_probe.rs`).
world-bench = []
# Tracy, the frame profiler: with `WOW_TRACY=1` the server's maps, packets and
# store show in Tracy's profiler, and without it they cost a flag's load
# (`src/tracy.rs`, docs/PROFILING.md). Off, with `--no-default-features`, the
# helpers are nothing and Tracy's C++ isn't built.
tracy = ["dep:tracy-client", "dep:tracy-client-sys"]

[dependencies]
tokio = { version = "1.53.3", features = [
    "net",
    "sync",
    "time",
    "io-util",
    "io-std",
    "macros",
    "rt-multi-thread",
    "signal",
] }
wow_login_messages = { git = "https://github.com/12932/wow_messages", rev = "27dfce0e5602c413bb0c400a561fd59aba5d82e7", features = ["tokio"] }
wow_world_messages = { git = "https://github.com/12932/wow_messages", rev = "27dfce0e5602c413bb0c400a561fd59aba5d82e7", features = ["sync", "tokio", "vanilla"] }
wow_world_base = { git = "https://github.com/12932/wow_messages", rev = "27dfce0e5602c413bb0c400a561fd59aba5d82e7", features = ["extended", "vanilla", "serde"] }
wow_items = { git = "https://github.com/12932/wow_messages", rev = "27dfce0e5602c413bb0c400a561fd59aba5d82e7", features = ["vanilla"] }
# The revision wow_world_messages pins: its encrypted reads and writes take
# this wow_srp's header halves, so another would be a second, unlike copy.
# 1.12 only: no TBC or Wrath headers (and with them no hmac).
wow_srp = { git = "https://github.com/gtker/wow_srp.git", rev = "9c5382a2915850efc69f05d7985ab06b3ec13163", default-features = false, features = ["srp-default-math"] }
walkdir = "2.5.0"

# The navmesh (rustigator's pathfinding, under its `raw` API): its tiles
# decoded off the map's thread and handed in (`load_nav_file`).
rustigator-pathfind = { git = "https://github.com/12932/rustigator", rev = "2c1dbc0239e9d18b4a4dc44f1428762a58872c1f" }
glam = "0.34.1"
# The navmesh and terrain builds, for the data setup.
rustigator-mapbuild = { git = "https://github.com/12932/rustigator", rev = "2c1dbc0239e9d18b4a4dc44f1428762a58872c1f" }
tracing = "0.1.44"
# The log's filter is `Targets` (RUST_LOG's `target=level` lists), not
# `env-filter`, which would bring regex in.
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
ahash = "0.8.12"
slab = "0.4.12"
# Tracy's protocol is that of the profiler v0.14.1 (docs/PROFILING.md): it is
# tracy-client-sys's, pinned below, as tracy-client takes several. On
# demand: it records only while a profiler is connected. Only on localhost:
# the profile (the call stacks, the log's warnings) is no one else's. System
# tracing stays because Tracy's call-stack sampling is part of it: both need
# an administrator on Windows (or root on Linux), and without one they do
# nothing; on Windows they are the only sampling profiler at hand. No
# `broadcast` (announcing the server on the network), no `code-transfer`,
# no `context-switch-tracing`.
tracy-client = { version = "0.19.0", optional = true, default-features = false, features = [
    "enable",
    "manual-lifetime",
    "ondemand",
    "only-localhost",
    "system-tracing",
    "sampling",
    "callstack-inlines",
] }
# 0.30.0 is Tracy v0.14.1's protocol (82). Another release of either is
# another protocol: change it with the viewer, and docs/PROFILING.md.
tracy-client-sys = { version = "=0.30.0", optional = true, default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rand = "0.10.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "display", "serde"] }
mimalloc = { version = "0.1.52", default-features = false }
smallvec = "1.16.3"
parking_lot = "0.12.5"
flate2 = "1.1.10"
md-5 = "0.11.0"
serde_json = "1.0.154"
# The data setup: its questions, its progress bars, and its flags.
dialoguer = { version = "0.12.0", default-features = false }
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive"] }

# Free disk space, and on Windows the registry and the fixed drives.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[[bin]]
name = "wow_vanilla_server"
path = "src/main.rs"

# Builds data/nav and data/terrain from the player's WoW client.
[[bin]]
name = "wvs-setup"
path = "src/bin/wvs-setup.rs"

# The whole world awake: the server alone, observers all over both
# continents (docs/PERFORMANCE.md). Built only with the feature.
[[bin]]
name = "wvs-world-bench"
path = "src/bin/wvs-world-bench.rs"
required-features = ["world-bench"]

# The concurrency micro-benchmarks: which channel, which lock, how the live
# settings are read, on wvs's own patterns (`cargo bench --bench sync`,
# docs/PERFORMANCE.md). divan's, so not libtest's harness.
[[bench]]
name = "sync"
harness = false

# Debug builds and the tests with their dependencies optimized (SQLite, tokio,
# wow_messages, the navmesh, compression): the suite takes a third less time,
# and the crate itself builds as quickly as before. See docs/PERFORMANCE.md.
[profile.dev]
# Line tables, not full debug info: backtraces keep their files and lines, and the
# objects and the incremental cache (once 71 GB in target/debug) shrink a lot.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
# Thin LTO and one codegen unit let the compiler inline across modules.
# A panic unwinds: a map whose actor panics is lost, the rest of the
# server goes on.
lto = "thin"
codegen-units = 1

[dev-dependencies]
# The real world's snapshot for the extended tests (`harness::real_world`).
ahash = { version = "0.8.12", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# The concurrency micro-benchmarks (`benches/sync.rs`): divan, and the
# channels and arc-swap they hold up against wvs's own.
divan = "0.1.21"
kanal = "0.1.1"
flume = "0.12.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.3"
